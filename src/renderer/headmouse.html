<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' file: data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" />
    <title>Maya head mouse</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font: 12px 'Segoe UI', system-ui, sans-serif; color: #fff; }
      .hm { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #111; -webkit-app-region: drag; }
      video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .85; }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; background: linear-gradient(transparent, rgba(0,0,0,.85)); display: flex; gap: 6px; align-items: center; }
      .bar span { flex: 1; line-height: 1.25; }
      button { -webkit-app-region: no-drag; border: 0; border-radius: 8px; padding: 4px 8px; background: rgba(255,255,255,.18); color: #fff; font: inherit; cursor: pointer; }
      button:hover { background: rgba(255,255,255,.32); }
      .dot { position: absolute; top: 8px; left: 8px; width: 10px; height: 10px; border-radius: 50%; background: #888; }
      .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
      .dot.click { background: #8b7bff; box-shadow: 0 0 10px #8b7bff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./headmouse.jsx"></script>
  </body>
</html>
