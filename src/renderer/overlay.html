<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Maya voice overlay</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font: 700 13px 'Segoe UI', Arial, sans-serif; }
      .tag { position: absolute; min-width: 18px; padding: 1px 5px; border-radius: 5px; background: #ffcc00; color: #000; text-align: center;
        box-shadow: 0 1px 3px rgba(0,0,0,.5); animation: pop .18s ease-out both; }
      .box { position: absolute; border: 1.5px solid rgba(255, 204, 0, .75); border-radius: 4px; }
      .cell { position: absolute; border: 1px solid rgba(0, 183, 255, .45); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
      .cell span { padding: 1px 5px; border-radius: 5px; background: rgba(0, 120, 200, .85); color: #fff; font-size: 14px; }
      .box.lit { border: 4px solid #00e5ff; border-radius: 8px; box-shadow: 0 0 0 4px rgba(0,229,255,.35), 0 0 22px rgba(0,229,255,.8); animation: glow 1s ease-in-out infinite; }
      .back { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); padding: 12px 26px; border-radius: 14px; background: #00e5ff; color: #002; font-size: 26px;
        box-shadow: 0 0 30px rgba(0,229,255,.9); animation: glow 1s ease-in-out infinite; }
      .ring { position: absolute; }
      .ring-track { fill: rgba(0,0,0,.25); stroke: rgba(255,255,255,.55); stroke-width: 6; }
      .ring-fill { fill: none; stroke: #ffcc00; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 32px 32px; transition: stroke-dashoffset .1s linear; }
      .point { position: absolute; border: 4px solid #8b7bff; border-radius: 10px; box-shadow: 0 0 0 6px rgba(139,123,255,.25), 0 0 26px rgba(139,123,255,.9);
        animation: pop .25s ease-out both, pulse 1.1s ease-in-out .25s infinite; }
      .arrow { position: absolute; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 24px solid #8b7bff;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); animation: bob .7s ease-in-out infinite alternate; }
      .label { position: absolute; padding: 5px 12px; border-radius: 10px; background: #8b7bff; color: #fff; font-size: 15px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
      @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(139,123,255,.12), 0 0 40px rgba(139,123,255,1); } }
      @keyframes bob { to { transform: translateY(-10px); } }
      @keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(0,229,255,.2), 0 0 34px rgba(0,229,255,1); } }
      @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .tag, .point, .arrow { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./overlay.jsx"></script>
  </body>
</html>
